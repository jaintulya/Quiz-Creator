<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="qGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#e07820"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="38" y1="8" x2="26" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#f5ba72"/>
    </linearGradient>
    <mask id="slashMask">
      <rect width="64" height="64" fill="white"/>
      <!-- Diagonal slash cut -->
      <polygon points="36,4 42,4 28,60 22,60" fill="black"/>
    </mask>
  </defs>

  <!-- Dark background -->
  <rect width="64" height="64" rx="13" fill="#0f0e0d"/>

  <!-- Bold Q letter, masked with diagonal slash -->
  <g mask="url(#slashMask)">
    <!-- Q outer ring -->
    <circle cx="30" cy="30" r="20" fill="url(#qGrad)"/>
    <!-- Q hole -->
    <circle cx="30" cy="30" r="12" fill="#0f0e0d"/>
    <!-- Q tail -->
    <rect x="36" y="38" width="7" height="4" rx="2" fill="url(#qGrad)" transform="rotate(45 39.5 40)"/>
  </g>

  <!-- Lightning bolt (sits on top of the slash) -->
  <polygon
    points="37,8  28,34  34,34  26,58  44,28  37,28"
    fill="url(#boltGrad)"
    opacity="0.97"
  />

  <!-- Subtle inner shadow on bolt left edge -->
  <polygon
    points="37,8  28,34  31,34  37,14"
    fill="#ffffff"
    opacity="0.15"
  />
</svg>