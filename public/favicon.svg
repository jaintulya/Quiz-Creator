<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181512" />
      <stop offset="50%" stop-color="#12100e" />
      <stop offset="100%" stop-color="#080706" />
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.1" />
    </linearGradient>

    <!-- Golden Brain & Core Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde68a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Sparkle Glow -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Radial Core Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Ambient Light in Center -->
  <circle cx="32" cy="33" r="22" fill="url(#ambientGlow)" />

  <!-- Premium Brain Emblem -->
  <g filter="url(#glow)">
    <!-- Left Hemisphere -->
    <path
      d="M30 18.5 C25 18.5 20.5 20.8 19 24.5 C16.5 26.2 15 29.5 15.5 33 C14.5 35 15 38 17 40 C17.8 44 21 46.5 25 46.5 C27 46.5 29 45.5 30 44"
      stroke="url(#goldGrad)"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Left Inner Neural Circuit Fold -->
    <path
      d="M23 27 C26 29 27 33 24 36 C22 38 24 41 27 41"
      stroke="url(#goldGrad)"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.9"
    />

    <!-- Right Hemisphere -->
    <path
      d="M34 18.5 C39 18.5 43.5 20.8 45 24.5 C47.5 26.2 49 29.5 48.5 33 C49.5 35 49 38 47 40 C46.2 44 43 46.5 39 46.5 C37 46.5 35 45.5 34 44"
      stroke="url(#goldGrad)"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Right Inner Neural Circuit Fold -->
    <path
      d="M41 27 C38 29 37 33 40 36 C42 38 40 41 37 41"
      stroke="url(#goldGrad)"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.9"
    />

    <!-- Central Neural Fissure Axis -->
    <line x1="32" y1="20" x2="32" y2="43" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Glowing AI Sparkle Star (Top Right) -->
  <path
    d="M49 11 C49 14.5 51 16.5 54.5 16.5 C51 16.5 49 18.5 49 22 C49 18.5 47 16.5 43.5 16.5 C47 16.5 49 14.5 49 11 Z"
    fill="url(#sparkleGrad)"
  />

  <!-- Secondary Mini Sparkle (Bottom Left) -->
  <path
    d="M15 20 C15 21.8 16 22.8 17.8 22.8 C16 22.8 15 23.8 15 25.6 C15 23.8 14 22.8 12.2 22.8 C14 22.8 15 21.8 15 20 Z"
    fill="url(#sparkleGrad)"
    opacity="0.85"
  />
</svg>